name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.21"
          # 纯 stdlib，无 go.sum，禁用缓存避免 "Dependencies file is not found" 告警
          cache: false

      - name: Test
        run: |
          cd engine
          go test ./...
          go vet ./...

      - name: Build packages
        run: python3 scripts/build_pkg.py --build

      - name: Verify packages
        run: python3 scripts/verify_pkg.py

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: fnparse-packages
          path: |
            dist/*.ipk
            dist/*.apk
            dist/SHA256SUMS
